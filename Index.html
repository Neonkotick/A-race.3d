<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>А-race.3d</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
  body{background:#000;overflow:hidden;font-family:'Orbitron',sans-serif;color:#0ff;display:flex;justify-content:center;align-items:center;height:100%;height:100dvh;width:100vw}
  #gameContainer{position:relative;width:100%;max-width:430px;height:100%;height:100dvh;background:#000;overflow:hidden}
  @supports(padding:env(safe-area-inset-top)){
    #gameContainer{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  }
  canvas{display:block;width:100%;height:100%;background:#000}
  #ui{position:absolute;inset:0;pointer-events:none}
  #hud{
    position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;
    display:none;flex-direction:column;align-items:center;gap:6px;
    z-index:5;pointer-events:none;
  }
  #score{
    font-size:clamp(22px,6vw,32px);font-weight:900;letter-spacing:2px;
    color:#fff;text-shadow:0 0 8px #0ff,0 0 20px rgba(0,255,255,.5);
    line-height:1;padding:0 12px;
  }
  #hudRow{
    display:flex;flex-direction:row;align-items:center;justify-content:center;
    gap:14px;flex-wrap:nowrap;
  }
  #distance,#crystals,#lives{
    font-size:13px;letter-spacing:1px;
    background:rgba(0,12,20,.75);padding:5px 12px;
    border:1px solid rgba(0,255,255,.28);border-radius:20px;
    text-shadow:0 0 8px #0ff;white-space:nowrap;
  }
  #lives{color:#f68;border-color:rgba(255,100,140,.4);text-shadow:0 0 8px #f48}
  #crystals{color:#8ff}
  #menu,#gameover{position:absolute;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:auto;z-index:20}
  #gameover{display:none}
  .title{font-size:clamp(26px,8vw,40px);font-weight:900;letter-spacing:3px;color:#0ff;text-shadow:0 0 10px #0ff,0 0 24px #0ff;margin-bottom:6px}
  .subtitle{font-size:12px;color:#f80;letter-spacing:2px;margin-bottom:28px;text-shadow:0 0 8px #f80}
  .btn{background:transparent;border:2px solid #0ff;color:#0ff;font-family:'Orbitron',sans-serif;font-size:15px;padding:12px 36px;cursor:pointer;letter-spacing:2px;text-shadow:0 0 8px #0ff;box-shadow:0 0 14px rgba(0,255,255,.25);margin:8px}
  .btn:active{background:rgba(0,255,255,.12)}
  .btn-orange{border-color:#f80;color:#f80;text-shadow:0 0 8px #f80}
  .stats{margin-top:18px;font-size:12px;color:#8ff;text-align:center;line-height:1.85;opacity:.9}
  #hint{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:11px;color:rgba(0,255,255,.4)}
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="hud">
      <div id="score">0</div>
      <div id="hudRow">
        <div id="crystals">◆ 0</div>
        <div id="distance">0м</div>
        <div id="lives">♥♥♥</div>
      </div>
    </div>
    <div id="menu">
      <div class="title">А-RACE.3D</div>
      <div class="subtitle">SYSTEM GRID · TRON PROTOCOL</div>
      <button class="btn" id="startBtn">СТАРТ</button>
      <div class="stats">
        СВАЙП ← → смена полосы<br>
        Избегай препятствий · Собирай ◆<br>
        <span style="color:#0ff">◆</span> ·
        <span style="color:#c44dff">◈ щит: x2 скорость + DEREZ</span> ·
        <span style="color:#ff8c00">▲ буст</span>
      </div>
    </div>
    <div id="gameover">
      <div class="title" style="font-size:26px">СИСТЕМА СБОЯ</div>
      <div class="subtitle">PROTOCOL TERMINATED</div>
      <div class="stats" id="finalStats"></div>
      <button class="btn btn-orange" id="retryBtn">ПОВТОР</button>
    </div>
    <div id="hint">СВАЙП ВЛЕВО / ВПРАВО</div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const box = document.getElementById('gameContainer');

  let W = 0, H = 0;
  function resize() {
    const r = box.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    W = r.width; H = r.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  const STATE = { MENU: 0, PLAY: 1, OVER: 2 };
  let state = STATE.MENU;

  let score = 0, distance = 0, crystals = 0, lives = 3, bonusScore = 0;
  let highScore = +localStorage.getItem('arace3d_top') || 0;

  // lanes 0 1 2 left→right; player near bottom, world scrolls down (drive "up")
  const player = {
    lane: 1, visualX: 0,
    invincible: 0,
    flash: 0,
    speedHold: 0,
    recoverT: 0,
    shieldT: 0,
    speedBeforeShield: 0
  };

  let speed = 0;
  const SPEED_START = 2.7, SPEED_MAX = 12, RAMP = 3000;

  let scroll = 0, farScroll = 0;
  let obstacles = [], items = [], particles = [], trail = [], voxels = [];
  let spawnT = 0, itemT = 0;


  const C = { cyan: '#00f0ff', orange: '#ff8c00', purple: '#c44dff', red: '#ff2a4d', white: '#e8ffff' };

  // input: horizontal swipe
  let sx = 0, sy = 0, locked = false;
  function onStart(x, y) { sx = x; sy = y; locked = false; }
  function onMove(x, y) {
    if (state !== STATE.PLAY || locked) return;
    const dx = x - sx, dy = y - sy;
    if (Math.abs(dx) > 22 && Math.abs(dx) > Math.abs(dy) * 1.1) {
      changeLane(dx < 0 ? -1 : 1);
      locked = true;
    }
  }
  canvas.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; onStart(t.clientX, t.clientY); }, { passive: false });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); const t = e.changedTouches[0]; onMove(t.clientX, t.clientY); }, { passive: false });
  canvas.addEventListener('touchend', e => { e.preventDefault(); locked = false; }, { passive: false });
  let md = false;
  canvas.addEventListener('mousedown', e => { md = true; onStart(e.clientX, e.clientY); });
  canvas.addEventListener('mousemove', e => { if (md) onMove(e.clientX, e.clientY); });
  canvas.addEventListener('mouseup', () => { md = false; locked = false; });
  addEventListener('keydown', e => {
    if (state === STATE.PLAY) {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeLane(-1);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') changeLane(1);
    }
    if ((e.code === 'Enter' || e.code === 'Space') && state !== STATE.PLAY) { e.preventDefault(); startGame(); }
  });
  document.getElementById('startBtn').onclick = startGame;
  document.getElementById('retryBtn').onclick = startGame;

  function changeLane(d) {
    if (state !== STATE.PLAY) return;
    const n = player.lane + d;
    if (n >= 0 && n <= 2) player.lane = n;
  }

  function startGame() {
    state = STATE.PLAY;
    score = 0; distance = 0; crystals = 0; lives = 3; bonusScore = 0;
    speed = SPEED_START;
    player.lane = 1;
    const L = layout();
    player.visualX = L.laneX[1];
    player.invincible = 0;
    player.flash = 0;
    player.speedHold = 0;
    player.recoverT = 0;
    player.shieldT = 0;
    player.speedBeforeShield = 0;
    hitLock = false;
    obstacles = []; items = []; particles = []; trail = []; voxels = [];
    scroll = farScroll = 0;
    spawnT = 1.5; itemT = 0.7;
    document.getElementById('menu').style.display = 'none';
    document.getElementById('gameover').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    document.getElementById('hint').style.display = 'none';
  }

  function livesStr() {
    return '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, 3 - lives));
  }

  let hitLock = false;

  function onHit(L) {
    // prevent re-entry / multi-hit same frame freeze
    if (hitLock || state !== STATE.PLAY) return;
    hitLock = true;

    try {
      lives = Math.max(0, lives - 1);
      const py = L.playerY;
      burst(player.visualX, py, C.orange, 10);

      // clear nearby obstacles immediately (copy filter — no mid-loop chaos)
      obstacles = obstacles.filter(o => Math.abs(o.y - py) >= 90);

      document.getElementById('lives').textContent = livesStr();

      if (lives <= 0) {
        player.flash = 0;
        player.invincible = 0;
        player.recoverT = 0;
        hitLock = false;
        gameOver();
        return;
      }

      // revive: blink + slow, then 10s recover
      player.flash = 1.6;
      player.invincible = 2.0;
      player.speedHold = Math.max(speed, SPEED_START);
      speed = Math.max(SPEED_START * 0.7, speed * 0.55);
      player.recoverT = 10;
    } finally {
      // release lock next frame so we don't soft-lock
      setTimeout(() => { hitLock = false; }, 50);
    }
  }

  function gameOver() {
    if (state === STATE.OVER) return;
    state = STATE.OVER;
    hitLock = false;
    player.flash = 0;
    player.invincible = 0;
    player.recoverT = 0;
    // stop world pressure
    obstacles = [];
    items = [];
    voxels = [];
    try {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('arace3d_top', highScore);
      }
    } catch (e) {}
    const hud = document.getElementById('hud');
    const go = document.getElementById('gameover');
    const fs = document.getElementById('finalStats');
    const hint = document.getElementById('hint');
    if (hud) hud.style.display = 'none';
    if (fs) {
      fs.innerHTML =
        'ДИСТАНЦИЯ  ' + Math.floor(distance) + 'м<br>КРИСТАЛЛЫ  ' + crystals +
        '<br>СЧЁТ  ' + score + '<br>РЕКОРД  ' + highScore;
    }
    if (go) go.style.display = 'flex';
    if (hint) hint.style.display = 'block';
  }

  function spawnObstacle() {
    const y = -40;
    if (Math.random() < 0.13 && distance > 450) {
      const lanes = [0, 1, 2].sort(() => Math.random() - 0.5);
      obstacles.push({ lane: lanes[0], y, type: 'barrier' });
      obstacles.push({ lane: lanes[1], y, type: 'barrier' });
    } else {
      obstacles.push({
        lane: Math.floor(Math.random() * 3), y,
        type: Math.random() < 0.55 ? 'barrier' : 'spike'
      });
    }
  }

  function spawnItem() {
    const r = Math.random();
    const lane = Math.floor(Math.random() * 3);
    // rare powerups as single pickups
    if (r > 0.94) {
      items.push({ lane, y: -30, type: 'shield', pulse: Math.random() * 6.28 });
      return;
    }
    if (r > 0.88) {
      items.push({ lane, y: -30, type: 'boost', pulse: Math.random() * 6.28 });
      return;
    }
    // crystals: random 1–5 in a short line
    const count = 1 + Math.floor(Math.random() * 5);
    const gap = 32;
    const startY = -30;
    for (let i = 0; i < count; i++) {
      items.push({
        lane,
        y: startY - i * gap,
        type: 'crystal',
        pulse: Math.random() * 6.28 + i * 0.25
      });
    }
  }

  function getSpeed(d) {
    const t = Math.min(1, d / RAMP);
    const e = t < 0.75 ? (t / 0.75) * 0.85 : 0.85 + 0.15 * (1 - Math.pow(1 - (t - 0.75) / 0.25, 2));
    return SPEED_START + (SPEED_MAX - SPEED_START) * e;
  }

  const MAX_PARTICLES = 40;
  const MAX_VOXELS = 80;
  function burst(x, y, color, n) {
    n = Math.min(n, 12);
    for (let i = 0; i < n; i++) {
      if (particles.length >= MAX_PARTICLES) particles.shift();
      const a = Math.random() * Math.PI * 2, s = 35 + Math.random() * 100;
      particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0.28, max: 0.28, color, size: 1.4 + Math.random() * 1.8
      });
    }
  }

  // Tron Legacy-style deresolution: shatter into cubes
  function derezAt(x, y, color, pts) {
    bonusScore += pts;
    const n = 14;
    for (let i = 0; i < n; i++) {
      if (voxels.length >= MAX_VOXELS) voxels.shift();
      const a = Math.random() * Math.PI * 2;
      const s = 40 + Math.random() * 140;
      const sz = 2 + Math.random() * 4;
      voxels.push({
        x: x + (Math.random() - 0.5) * 12,
        y: y + (Math.random() - 0.5) * 12,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 30,
        rot: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 10,
        life: 0.45 + Math.random() * 0.35,
        max: 0.8,
        size: sz,
        color: color
      });
    }
    // energy flash
    burst(x, y, color, 6);
  }

  function shieldDestroyObstacle(o, L) {
    const x = L.laneX[o.lane];
    const y = o.y;
    // base points: car 2, bike 3 → x2 under shield
    const base = o.type === 'barrier' ? 2 : 3;
    const col = o.type === 'barrier' ? '#ff3355' : '#ffaa33';
    derezAt(x, y, col, base * 2);
  }

  let _L = null, _Lw = 0, _Lh = 0;
  function getLayout() {
    if (!_L || _Lw !== W || _Lh !== H) {
      _L = layout();
      _Lw = W; _Lh = H;
    }
    return _L;
  }

  function update(dt) {
    if (state !== STATE.PLAY) return;
    const L = getLayout();

    if (player.recoverT <= 0) {
      speed += (getSpeed(distance) - speed) * Math.min(1, 1.5 * dt);
    }
    player.visualX += (L.laneX[player.lane] - player.visualX) * Math.min(1, 13 * dt);
    const pY = L.playerY;
    if (player.invincible > 0) player.invincible -= dt;
    if (player.flash > 0) player.flash -= dt;
    if (player.shieldT > 0) {
      player.shieldT -= dt;
      // maintain ~2x relative to pre-shield baseline vs curve
      const base = Math.max(player.speedBeforeShield || SPEED_START, getSpeed(distance));
      speed += (base * 2 - speed) * Math.min(1, 4 * dt);
      if (player.shieldT <= 0) {
        player.shieldT = 0;
        player.invincible = Math.min(player.invincible, 0.3);
        // return toward normal curve
        speed = Math.max(SPEED_START, (player.speedBeforeShield || getSpeed(distance)));
        player.speedBeforeShield = 0;
      }
    }

    // after respawn: hold reduced speed, then over 10s ease back to held speed / curve
    if (player.recoverT > 0) {
      player.recoverT -= dt;
      const target = getSpeed(distance);
      const hold = player.speedHold || target;
      // blend from current slow toward max(hold, curve) across 10s
      const t = 1 - Math.max(0, player.recoverT) / 10;
      const eased = t * t * (3 - 2 * t); // smoothstep
      const goal = Math.max(hold, target);
      speed += (SPEED_START * 0.55 + (goal - SPEED_START * 0.55) * eased - speed) * Math.min(1, 3 * dt);
      if (player.recoverT <= 0) {
        player.recoverT = 0;
        player.speedHold = 0;
      }
    }

    // trail behind — long beam out of bottom frame
    trail.unshift({ x: player.visualX, y: pY + 8, life: 1 });
    if (trail.length > 36) trail.pop();
    for (let i = trail.length - 1; i >= 0; i--) {
      trail[i].life -= dt * 0.55;
      trail[i].y += speed * dt * 95;
      if (trail[i].life <= 0 || trail[i].y > H + 80) trail.splice(i, 1);
    }

    if (!isFinite(speed) || speed < 0) speed = SPEED_START;
    scroll += speed * dt * 50;
    farScroll += speed * dt * 10;
    distance += speed * dt * 9;
    score = Math.floor(distance) + crystals * 25 + bonusScore;

    spawnT -= dt;
    if (spawnT <= 0) {
      spawnObstacle();
      spawnT = Math.max(0.48, 1.5 - distance / 2600) + Math.random() * 0.3;
    }
    itemT -= dt;
    if (itemT <= 0) {
      spawnItem();
      itemT = 1.1 + Math.random() * 1.2;
    }

    const move = speed * dt * 90;

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.y += move;
      if (o.y > H + 40) { obstacles.splice(i, 1); continue; }
      // hit player zone
      if (o.y > pY - 32 && o.y < pY + 26) {
        const lx = L.laneX[o.lane];
        if (Math.abs(lx - player.visualX) < L.laneW * 0.42) {
          if (player.shieldT > 0) {
            // shield rams & derezzes program-vehicles
            shieldDestroyObstacle(o, L);
            obstacles.splice(i, 1);
            continue;
          }
          if (player.invincible <= 0 && player.flash <= 0 && !hitLock) {
            onHit(L);
            if (state !== STATE.PLAY) break;
            continue;
          }
        }
      }
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += move;
      it.pulse += dt * 6;
      if (it.y > H + 30) { items.splice(i, 1); continue; }
      if (it.y > pY - 26 && it.y < pY + 20) {
        if (Math.abs(L.laneX[it.lane] - player.visualX) < L.laneW * 0.4) {
          if (it.type === 'crystal') {
            crystals++;
            burst(L.laneX[it.lane], it.y, C.cyan, 6);
          } else if (it.type === 'boost') {
            speed = Math.min(SPEED_MAX * 1.15, speed * 1.3);
            bonusScore += 50;
            burst(L.laneX[it.lane], it.y, C.orange, 6);
          } else {
            // purple shield: 2x speed + armor + auto-derez obstacles
            if (player.shieldT <= 0) {
              player.speedBeforeShield = speed;
              speed = speed * 2;
            }
            player.shieldT = 5;
            player.invincible = 5;
            burst(L.laneX[it.lane], it.y, C.purple, 8);
          }
          items.splice(i, 1);
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = voxels.length - 1; i >= 0; i--) {
      const v = voxels[i];
      v.x += v.vx * dt;
      v.y += v.vy * dt;
      v.vy += 220 * dt;
      v.rot += v.vr * dt;
      v.life -= dt;
      v.vx *= 0.98;
      if (v.life <= 0) voxels.splice(i, 1);
    }

    document.getElementById('score').textContent = String(score);
    document.getElementById('distance').textContent = Math.floor(distance) + 'м';
    document.getElementById('crystals').textContent = '◆ ' + crystals;
    document.getElementById('lives').textContent = livesStr();
  }

  function draw() {
    const L = getLayout();
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // stars (cheap, no shadows)
    ctx.fillStyle = C.cyan;
    const tNow = performance.now() * 0.002;
    for (let i = 0; i < STARS.length; i++) {
      const st = STARS[i];
      let sy = (st.y * H + farScroll * 0.2) % H;
      if (sy < 0) sy += H;
      ctx.globalAlpha = st.a * (0.7 + 0.3 * Math.sin(tNow + st.tw));
      ctx.fillRect(st.x * W, sy, st.s, st.s);
    }
    ctx.globalAlpha = 1;

    // road body
    ctx.fillStyle = '#081018';
    ctx.fillRect(L.roadL, 0, L.roadW, H);

    // road edge glow
    ctx.strokeStyle = 'rgba(0,240,255,0.55)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(L.roadL, 0); ctx.lineTo(L.roadL, H); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(L.roadR, 0); ctx.lineTo(L.roadR, H); ctx.stroke();

    // lane dividers (dashed vertical)
    const dashH = 22, gap = 16;
    const off = scroll % (dashH + gap);
    for (let i = 1; i < 3; i++) {
      const x = L.roadL + L.laneW * i;
      ctx.strokeStyle = 'rgba(0,220,255,0.3)';
      ctx.lineWidth = 1.6;
      for (let y = -off; y < H + 30; y += dashH + gap) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + dashH);
        ctx.stroke();
      }
    }

    // horizontal grid
    const gSp = 48;
    const gOff = scroll % gSp;
    for (let y = -gOff; y < H + 20; y += gSp) {
      ctx.strokeStyle = 'rgba(0,180,220,0.07)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(L.roadL, y);
      ctx.lineTo(L.roadR, y);
      ctx.stroke();
    }

    // outside road — Grid / system floor
    ctx.fillStyle = '#03080c';
    ctx.fillRect(0, 0, L.roadL, H);
    ctx.fillRect(L.roadR, 0, W - L.roadR, H);

    // faint circuit grid on shoulders
    ctx.strokeStyle = 'rgba(0, 160, 200, 0.08)';
    ctx.lineWidth = 1;
    const cg = 28;
    const cgo = scroll * 0.4 % cg;
    for (let y = -cgo; y < H + cg; y += cg) {
      ctx.beginPath();
      ctx.moveTo(0, y); ctx.lineTo(L.roadL - 2, y); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(L.roadR + 2, y); ctx.lineTo(W, y); ctx.stroke();
    }
    for (let x = 8; x < L.roadL - 4; x += cg) {
      ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let x = L.roadR + 8; x < W; x += cg) {
      ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }

    // Tron roadside structures (scroll with road)
    const shoulderW = L.roadL;
    for (let i = 0; i < ROADSIDE.length; i++) {
      const p = ROADSIDE[i];
      let y = ((p.yOff * (H + 120)) + scroll * 0.85) % (H + 120) - 40;
      const left = p.side === 0;
      const baseX = left ? L.roadL - 10 : L.roadR + 10;
      const dir = left ? -1 : 1;

      if (p.kind === 0) {
        // energy tower
        const tw = 5, th = p.h;
        ctx.fillStyle = 'rgba(0, 40, 55, 0.9)';
        ctx.fillRect(baseX + dir * 8 - tw / 2, y - th, tw, th);
        ctx.fillStyle = 'rgba(0, 240, 255, 0.35)';
        ctx.fillRect(baseX + dir * 8 - 1, y - th, 2, th);
        // top node
        ctx.fillStyle = C.cyan;
        ctx.globalAlpha = 0.55 + 0.25 * Math.sin(performance.now() * 0.004 + p.phase);
        ctx.fillRect(baseX + dir * 8 - 3, y - th - 4, 6, 4);
        ctx.globalAlpha = 1;
      } else if (p.kind === 1) {
        // data node (diamond)
        const nx = baseX + dir * 16;
        ctx.strokeStyle = 'rgba(0, 220, 255, 0.4)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(nx, y - 6);
        ctx.lineTo(nx + dir * 6, y);
        ctx.lineTo(nx, y + 6);
        ctx.lineTo(nx - dir * 6, y);
        ctx.closePath();
        ctx.stroke();
        ctx.fillStyle = 'rgba(0, 240, 255, 0.15)';
        ctx.fill();
      } else if (p.kind === 2) {
        // circuit traces
        const cx = baseX + dir * 6;
        ctx.strokeStyle = 'rgba(0, 200, 255, 0.25)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx, y);
        ctx.lineTo(cx + dir * 14, y);
        ctx.lineTo(cx + dir * 14, y - 10);
        ctx.lineTo(cx + dir * 22, y - 10);
        ctx.stroke();
        ctx.fillStyle = 'rgba(0, 240, 255, 0.45)';
        ctx.fillRect(cx + dir * 20, y - 12, 3, 3);
      } else if (p.kind === 3) {
        // vertical data stream
        const dx = baseX + dir * 18;
        const pulse = (scroll * 0.02 + p.phase) % 1;
        for (let k = 0; k < 5; k++) {
          const yy = y - k * 7 - pulse * 7;
          ctx.globalAlpha = 0.15 + (1 - k / 5) * 0.35;
          ctx.fillStyle = k % 2 ? C.cyan : 'rgba(0, 180, 255, 0.8)';
          ctx.fillRect(dx - 1, yy, 2, 5);
        }
        ctx.globalAlpha = 1;
      } else {
        // low wall / IO port
        const wx = baseX + dir * 4;
        ctx.fillStyle = 'rgba(0, 30, 40, 0.85)';
        ctx.fillRect(wx - (left ? 14 : 0), y - 8, 14, 10);
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
        ctx.lineWidth = 1;
        ctx.strokeRect(wx - (left ? 14 : 0), y - 8, 14, 10);
        ctx.fillStyle = 'rgba(0, 255, 200, 0.5)';
        ctx.fillRect(wx - (left ? 10 : -4), y - 4, 4, 2);
      }
    }

    // soft inner edge light (road boundary already drawn)
    ctx.fillStyle = 'rgba(0, 240, 255, 0.04)';
    ctx.fillRect(L.roadL - 6, 0, 6, H);
    ctx.fillRect(L.roadR, 0, 6, H);

    // objects — soft neon (same language as road)
    for (let i = 0; i < items.length; i++) {
      const obj = items[i];
      const x = L.laneX[obj.lane], y = obj.y;
      if (y < -40 || y > H + 40) continue;
      drawSoftItem(obj, x, y);
    }
    for (let i = 0; i < obstacles.length; i++) {
      const obj = obstacles[i];
      const x = L.laneX[obj.lane], y = obj.y;
      if (y < -50 || y > H + 50) continue;
      if (obj.type === 'barrier') drawSoftCar(x, y);
      else drawSoftMoto(x, y);
    }

    // neon trail / beam — long, exits bottom of frame
    if (trail.length > 1 && !(player.flash > 0 && (performance.now() / 80 | 0) % 2)) {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      // outer glow
      ctx.beginPath();
      for (let i = 0; i < trail.length; i++) {
        const t = trail[i];
        if (i === 0) ctx.moveTo(t.x, t.y); else ctx.lineTo(t.x, t.y);
      }
      // force extend past bottom
      const last = trail[trail.length - 1];
      if (last.y < H + 40) ctx.lineTo(last.x, H + 50);
      ctx.strokeStyle = 'rgba(0,240,255,0.18)';
      ctx.lineWidth = 8;
      ctx.stroke();
      // core
      ctx.beginPath();
      for (let i = 0; i < trail.length; i++) {
        const t = trail[i];
        if (i === 0) ctx.moveTo(t.x, t.y); else ctx.lineTo(t.x, t.y);
      }
      if (last.y < H + 40) ctx.lineTo(last.x, H + 50);
      ctx.strokeStyle = 'rgba(180,255,255,0.85)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // --- bike TOP-DOWN ---
    drawBikeTop(player.visualX, L.playerY);

    // particles (no shadowBlur)
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size * 0.5, p.y - p.size * 0.5, p.size, p.size);
    }
    // Tron derez voxels (cubes)
    for (let i = 0; i < voxels.length; i++) {
      const v = voxels[i];
      const a = Math.max(0, v.life / v.max);
      ctx.save();
      ctx.translate(v.x, v.y);
      ctx.rotate(v.rot);
      ctx.globalAlpha = a;
      ctx.fillStyle = v.color;
      ctx.fillRect(-v.size * 0.5, -v.size * 0.5, v.size, v.size);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 0.6;
      ctx.strokeRect(-v.size * 0.5, -v.size * 0.5, v.size, v.size);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // soft edge darkening (cheaper than radial gradient)
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, 24);
    ctx.fillRect(0, H - 28, W, 28);
  }

  function roundRectPath(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawSoftItem(obj, x, y) {
    const pulse = 0.85 + Math.sin(obj.pulse || 0) * 0.15;
    ctx.save();
    ctx.translate(x, y);
    if (obj.type === 'crystal') {
      ctx.fillStyle = 'rgba(0,240,255,0.2)';
      ctx.beginPath(); ctx.ellipse(0, 0, 10 * pulse, 12 * pulse, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,240,255,0.85)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(0, -9 * pulse);
      ctx.quadraticCurveTo(7, 0, 0, 8 * pulse);
      ctx.quadraticCurveTo(-7, 0, 0, -9 * pulse);
      ctx.stroke();
      ctx.fillStyle = 'rgba(180,255,255,0.55)';
      ctx.beginPath(); ctx.ellipse(0, -2, 2.2, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    } else if (obj.type === 'boost') {
      ctx.strokeStyle = 'rgba(255,140,0,0.9)';
      ctx.fillStyle = 'rgba(255,140,0,0.25)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(0, -10);
      ctx.lineTo(7, 2);
      ctx.lineTo(2, 2);
      ctx.lineTo(2, 10);
      ctx.lineTo(-2, 10);
      ctx.lineTo(-2, 2);
      ctx.lineTo(-7, 2);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(196,77,255,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 10 * pulse, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  function drawSoftCar(x, y) {
    ctx.save();
    ctx.translate(x, y);
    // body soft capsule
    ctx.fillStyle = 'rgba(160,16,36,0.92)';
    roundRectPath(-11, -16, 22, 32, 6);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,70,100,0.75)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    // cabin
    ctx.fillStyle = 'rgba(40,8,16,0.9)';
    roundRectPath(-7, -4, 14, 12, 3);
    ctx.fill();
    // windshield
    ctx.fillStyle = 'rgba(160,210,255,0.35)';
    roundRectPath(-6, -12, 12, 6, 2);
    ctx.fill();
    // lights
    ctx.fillStyle = 'rgba(255,200,100,0.85)';
    roundRectPath(-9, -16, 5, 2.5, 1);
    ctx.fill();
    roundRectPath(4, -16, 5, 2.5, 1);
    ctx.fill();
    ctx.restore();
  }

  function drawSoftMoto(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = 'rgba(255,170,50,0.9)';
    ctx.fillStyle = 'rgba(180,100,0,0.85)';
    ctx.lineWidth = 1.5;
    // body
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.quadraticCurveTo(6, -4, 5, 6);
    ctx.quadraticCurveTo(3, 12, 0, 13);
    ctx.quadraticCurveTo(-3, 12, -5, 6);
    ctx.quadraticCurveTo(-6, -4, 0, -14);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // rider
    ctx.fillStyle = 'rgba(255,200,100,0.9)';
    ctx.beginPath(); ctx.arc(0, -2, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,220,150,0.95)';
    ctx.beginPath(); ctx.arc(0, -7, 3.2, 0, Math.PI * 2); ctx.fill();
    // wheels soft rings
    ctx.strokeStyle = 'rgba(255,180,80,0.7)';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -13, 3.2, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 12, 3.2, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function drawBikeTop(x, y) {
    if (player.flash > 0) {
      if (((performance.now() / 80) | 0) % 2 === 0) return;
    }
    if (player.shieldT > 0 || player.invincible > 0) {
      const pulse = 0.4 + Math.sin(performance.now() / 55) * 0.35;
      ctx.strokeStyle = player.shieldT > 0
        ? 'rgba(196,77,255,' + pulse + ')'
        : 'rgba(0,240,255,' + pulse + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, 26, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.save();
    ctx.translate(x, y);
    // soft light-cycle body
    ctx.fillStyle = 'rgba(0,24,36,0.95)';
    ctx.strokeStyle = 'rgba(0,240,255,0.9)';
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.quadraticCurveTo(9, -8, 9, 2);
    ctx.quadraticCurveTo(8, 12, 4, 15);
    ctx.lineTo(-4, 15);
    ctx.quadraticCurveTo(-8, 12, -9, 2);
    ctx.quadraticCurveTo(-9, -8, 0, -18);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // cockpit
    ctx.fillStyle = 'rgba(0,220,240,0.75)';
    ctx.beginPath(); ctx.ellipse(0, -2, 4, 5, 0, 0, Math.PI * 2); ctx.fill();
    // center neon
    ctx.strokeStyle = 'rgba(180,255,255,0.7)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, 12); ctx.stroke();
    // headlight
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(0, -16, 2.2, 0, Math.PI * 2); ctx.fill();
    // side fins soft
    ctx.strokeStyle = 'rgba(0,240,255,0.55)';
    ctx.beginPath(); ctx.moveTo(-8, 2); ctx.quadraticCurveTo(-13, 6, -10, 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8, 2); ctx.quadraticCurveTo(13, 6, 10, 10); ctx.stroke();
    ctx.restore();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
