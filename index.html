<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>А-race.3d</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gameContainer">
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="hud">
      <div id="score">0</div>
      <div id="hudRow">
        <div id="crystals">◆ 0</div>
        <div id="distance">0м</div>
        <div id="lives">♥♥♥</div>
      </div>
    </div>
    <div id="menu">
      <div class="title">А-RACE.3D</div>
      <div class="subtitle">SYSTEM GRID · TRON PROTOCOL</div>
      <button class="btn" id="startBtn">СТАРТ</button>
      <div class="stats">
        СВАЙП ← → смена полосы<br>
        Collect crystals · shield DEREZ<br>
        <span style="color:#0ff">◆</span> ·
        <span style="color:#c44dff">◈ щит: x2 + DEREZ</span> ·
        <span style="color:#ff8c00">▲ буст</span>
      </div>
    </div>
    <div id="gameover">
      <div class="title" style="font-size:26px">СИСТЕМА СБОЯ</div>
      <div class="subtitle">PROTOCOL TERMINATED</div>
      <div class="stats" id="finalStats"></div>
      <button class="btn btn-orange" id="retryBtn">ПОВТОР</button>
    </div>
    <div id="hint">СВАЙП ВЛЕВО / ВПРАВО</div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
